name: Docker Publish

on:
  # Build + push only after CI passes (same gate as release.yml)
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Validate Dockerfile on PRs (build-only, no push)
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

# Concurrency: group by commit SHA so tag-push and main-push Docker builds
# for the same release commit serialize instead of racing on GHCR writes.
# PRs get their own group per PR number and cancel stale builds.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('docker-pr-{0}', github.event.pull_request.number)
        || format('docker-{0}', github.event.workflow_run.head_sha || github.sha)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: waftester/waftester
  DOCKERHUB_IMAGE: qandil/waftester

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run if:
    #   - This is a direct PR trigger (build-only, no push), OR
    #   - CI succeeded AND was triggered by a push (not a PR).
    # Without the event==push filter, fork PRs passing CI would trigger
    # a Docker push to GHCR — a supply-chain attack vector (workflow_run
    # runs with base repo secrets regardless of trigger source).
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || '' }}

      # ------------------------------------------------------------------
      # 2. Compute build metadata (version, commit, date)
      # ------------------------------------------------------------------
      - name: Compute version metadata
        id: meta_version
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Check if this commit has a semver tag
          TAG=$(git describe --tags --exact-match "$HEAD_SHA" 2>/dev/null || echo "")
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
            # Guard: prerelease tags (e.g., v2.9.0-rc1, v3.0.0-beta.2) must NOT
            # push floating Docker tags (latest, 2, 2.9). Only stable releases do.
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_tag=true" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG"    >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Prerelease tag '$TAG' — building Docker image but not pushing floating semver tags"
              echo "is_tag=false" >> "$GITHUB_OUTPUT"
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            fi
          else
            VERSION="dev-${COMMIT}"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

          # Default is_prerelease to false if not set above
          if ! grep -q '^is_prerelease=' "$GITHUB_OUTPUT"; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}"   >> "$GITHUB_OUTPUT"
          echo "date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "📦 VERSION=${VERSION}  COMMIT=${COMMIT}  DATE=${BUILD_DATE}"

      # ------------------------------------------------------------------
      # 3. Docker metadata — tags & OCI labels
      # ------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            # Tagged release: v1.2.3 → 1.2.3, 1.2, 1, latest
            type=semver,pattern={{version}},value=${{ steps.meta_version.outputs.tag }},enable=${{ steps.meta_version.outputs.is_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.meta_version.outputs.tag }},enable=${{ steps.meta_version.outputs.is_tag }}
            type=semver,pattern={{major}},value=${{ steps.meta_version.outputs.tag }},enable=${{ steps.meta_version.outputs.is_tag }}
            # Main push (no tag): edge — excludes prereleases which set is_tag=false
            type=raw,value=edge,enable=${{ steps.meta_version.outputs.is_tag == 'false' && steps.meta_version.outputs.is_prerelease != 'true' && github.event_name != 'pull_request' }}
            # Always: sha-abc1234
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=waf-tester
            org.opencontainers.image.description=Comprehensive WAF security testing platform with MCP server
            org.opencontainers.image.vendor=WAFtester
            org.opencontainers.image.licenses=BUSL-1.1

      # ------------------------------------------------------------------
      # 4. Set up QEMU (multi-arch emulation for runtime stage)
      # ------------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: arm64

      # ------------------------------------------------------------------
      # 5. Set up Docker Buildx (multi-arch support)
      # ------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # ------------------------------------------------------------------
      # 6. Authenticate to GHCR (skip on PRs — build-only)
      # ------------------------------------------------------------------
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 7. Build (and push on non-PR events)
      # ------------------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta_version.outputs.version }}
            COMMIT=${{ steps.meta_version.outputs.commit }}
            BUILD_DATE=${{ steps.meta_version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ------------------------------------------------------------------
      # 8. Ensure package is public (org setting must allow public packages)
      # ------------------------------------------------------------------
      - name: Set package visibility to public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            /orgs/waftester/packages/container/waftester \
            -f visibility=public \
          || echo "::warning::Could not set package visibility to public — check org settings"

      # ------------------------------------------------------------------
      # 9. Push README to Docker Hub (tagged releases only)
      # ------------------------------------------------------------------
      - name: Push README to Docker Hub
        if: steps.meta_version.outputs.is_tag == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: DOCKERHUB_README.md
          short-description: "WAF security testing with 2800+ payloads — CLI + MCP server in one image"
